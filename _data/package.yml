name: FusionSystems
version: "0.1"
license: "GPL-2.0-or-later"
date: 2026-10-21
description: |
    Fusion systems in GAP

authors:
    - name: Pete Gautam
      url: https://github.com/pete-g00
    - name: Justin Lynd
      url: https://userweb.ucs.louisiana.edu/~jxl7583/

maintainers:
    - name: Pete Gautam
      url: https://github.com/pete-g00

GAP: ">= 4.12"

needed-pkgs:
    - name: "autpgrp"
      version: ">=1.10.2"
      url: "https://gap-packages.github.io/autpgrp/"
    - name: "format"
      version: ">=1.4.3"
      url: "https://gap-packages.github.io/format/"
    - name: "crisp"
      version: ">=1.4.5"
      url: "https://github.com/bh11/crisp/"

www: https://pete-g00.github.io/FusionSystems/
readme: README.md
packageinfo: https://pete-g00.github.io/FusionSystems/PackageInfo.g

downloads:
    - name: .tar.gz
      url: https://github.com/pete-g00/FusionSystems/releases/download/v0.1/FusionSystems-0.1.tar.gz

abstract: |
    The FusionSystems package allows for computation with fusion systems. Currently, it supports finding proto-essential subgroups for a given p-group and checking whether it could support reduced fusion systems.

status: dev
doc-html: doc/chap0.html
doc-pdf: doc/manual.pdf
